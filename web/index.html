<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      No `noindex` here. The landing page is public and meant to be found.

      Every app route (/queue, /signin, /target, /u/:token) is served from THIS
      same file, so a blanket rule here would apply to all of them. The server
      sends `X-Robots-Tag: noindex` for everything except `/` instead — see
      src/app.js. A header can vary per request; a meta tag in a shared shell
      cannot.
    -->
    <title>Unique | Automated Outreach In Your Voice</title>
    <meta
      name="description"
      content="Unique learns how you actually write, finds the right people, and drafts every cold email in your own voice. You read and send each one yourself."
    />

    <!-- Link previews. A waitlist page gets shared in DMs and group chats far more
         than it gets found in search, so these matter more than the title tag. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unique" />
    <meta property="og:title" content="Unique | Automated Outreach In Your Voice" />
    <meta
      property="og:description"
      content="Unique learns how you actually write, finds the right people, and drafts every cold email in your own voice. You read and send each one yourself."
    />
    <meta property="og:url" content="https://try-unique.com/" />
    <!-- The wordmark on paper, rendered from the real self-hosted Newsreader at the
         1200x630 every unfurl expects. Anything else gets cropped by someone. -->
    <meta property="og:image" content="https://try-unique.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Unique" />
    <!-- summary_large_image, not summary: a 1200x630 card is wasted in the small
         square variant. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://try-unique.com/og.png" />
    <meta name="twitter:title" content="Unique | Automated Outreach In Your Voice" />
    <meta
      name="twitter:description"
      content="Outreach in your own hand. Private beta."
    />

    <link rel="canonical" href="https://try-unique.com/" />

    <!-- The wordmark as a square: a Newsreader U and the red period, drawn from the
         real font outline. SVG first so it stays crisp at any density; the PNG is
         the fallback for browsers that will not take an SVG icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Self-hosted Newsreader + Space Mono. No external font request is made. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
