<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Unique">
  <title>Unique</title>
  <!-- The masthead wordmark compressed to a square: the same Newsreader U and the
       same red period as "Unique." on the page, drawn from the real font outline.
       Instantiated at wght 600 / opsz 8 — Newsreader's optical-size axis exists so
       small sizes get sturdier strokes, and a favicon is read at 16px.
       Laid out on the glyph's INK bounds, not its advance width: the advance
       carries side bearings, which pushed the period off the canvas.
       Square corners are deliberate; the design has no border-radius except on
       status dots. -->
